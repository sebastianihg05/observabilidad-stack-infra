# configuracion de promtail
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # logs del sistema
  - job_name: system
    static_configs:
    - targets:
        - localhost
      labels:
        job: varlogs
        host: servidor-seba
        __path__: /var/log/*log

  # logs simulados de la nube (json)
  - job_name: cloud_events
    static_configs:
    - targets:
        - localhost
      labels:
        job: nube_simulada_seba
        env: desarrollo
        host: servidor-seba
        __path__: /var/cloud-logs/*.json
    pipeline_stages:
      # saco los campos del json
      - json:
          expressions:
            level: severity
            action: eventName
      # solo level pasa a etiqueta
      - labels:
          level:
